{% extends 'base.html' %}

{% block head %}
<title>Task Smash </title>
{% endblock %}

{% block body %}

<div class="content">
      <h1>Edit your Task</h1>
      <form action="/update/{{task_to_be_edited.id}}" method="post">
        <input
          type="text"
          name="content"
          id="content"
          value="{{task_to_be_edited.content}}"
        />
        <input type="submit" value="Edit">
      </form>
    </div>

{% endblock %}
